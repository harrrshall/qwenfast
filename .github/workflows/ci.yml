name: ci
on:
  push:
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: agent
      - run: npx tsc --noEmit
        working-directory: agent
      - run: npm test
        working-directory: agent

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install fastapi uvicorn "pydantic>=2" httpx pytest pytest-asyncio anyio prometheus_client jinja2 safetensors numpy transformers pyzmq
      - run: pytest -q

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in $(git ls-files '*.sh') code/bin/qfc agent/bin/qfa; do sh -n "$f"; done
      - run: python3 -m py_compile code/patches/apply.py agent/tbench/report.py scripts/lint_docs.py
      - run: python3 scripts/lint_docs.py $(git ls-files '*.md')
