[project]
name = "qwenfast-tbench"
version = "0.1.0"
description = "harbor adapter that runs the qwenfast pi agent on terminal-bench"
requires-python = ">=3.11"
dependencies = ["harbor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwenfast_tbench"]
